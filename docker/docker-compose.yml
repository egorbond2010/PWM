version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: neutralmap_postgis
    restart: always
    environment:
      POSTGRES_DB: neutralmap
      POSTGRES_USER: neutralmap_user
      POSTGRES_PASSWORD: neutralmap_secret_password
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neutralmap_user -d neutralmap"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: neutralmap_backend
    restart: always
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://neutralmap_user:neutralmap_secret_password@postgis:5432/neutralmap?sslmode=disable"
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "8080:8080"

  sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sync
    container_name: neutralmap_sync
    restart: always
    environment:
      BACKEND_URL: "http://backend:8080"
      POLL_INTERVAL: "300s"
    depends_on:
      - backend

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: neutralmap_frontend
    restart: always
    ports:
      - "3000:80"

  nginx:
    image: nginx:alpine
    container_name: neutralmap_nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  postgis_data:
